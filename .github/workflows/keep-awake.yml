name: Keep the API awake

# Render's free tier sleeps after ~15 minutes without a request. This asks /health every 5 minutes
# during shop hours: 07:00-15:55 UTC is 12:00-20:55 in Pakistan. The first request of the day wakes the
# API (about 40 s), so each try waits up to 90 s and tries again if it fails.
on:
  schedule:
    - cron: "*/5 7-15 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ask /health
        run: |
          curl --fail --silent --show-error \
            --max-time 90 --retry 4 --retry-delay 15 --retry-all-errors \
            --output /dev/null --write-out 'status=%{http_code} time=%{time_total}s\n' \
            https://zindex-api.onrender.com/health
