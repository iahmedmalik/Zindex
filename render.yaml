# Render Blueprint for the API. Secrets are never written here: `sync: false` means Render asks for the
# value in its dashboard, and the value stays there. The database is Neon (free); the web app is on Vercel.
services:
  - type: web
    name: zindex-api
    runtime: node
    region: singapore # next to the Neon database
    plan: free
    # NODE_ENV=production would make `npm ci` skip dev dependencies, and the build tool (tsup) is one of them.
    buildCommand: npm ci --include=dev && npm run build -w @zindex/api
    startCommand: npm run start -w @zindex/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL_APP
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: WEB_ORIGIN
        sync: false
      # Email for sign-up confirmation and password reset (Brevo's free plan). Without it the links are only logged.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Optional: Shopify product sync. One line of JSON, read_products only. Leave unset to switch it off.
      - key: SHOPIFY_APPS
        sync: false
      # Who may sign up (comma-separated emails). Leave it set in production: Zindex is by invitation.
      - key: OWNER_EMAILS
        sync: false
      # The public demo ("Try the demo"). Both set = the demo is on; the password is public on purpose.
      - key: DEMO_EMAIL
        sync: false
      - key: DEMO_PASSWORD
        sync: false
